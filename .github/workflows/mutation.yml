name: Mutation

# Solo a mano: lánzalo sobre main, porque las cachés de otras ramas no las ven los PR.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Trozos en paralelo (1-20)
        type: number
        default: 12

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: plan
        name: Repartir los ficheros en trozos de peso parecido
        # La entrada viaja por env: interpolarla en el script permitiría inyectar comandos.
        env:
          SHARDS: ${{ inputs.shards }}
        run: echo "matrix=$(node scripts/mutation/cli.ts plan --shards "${SHARDS}")" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.shard.index }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Un trozo caído no debe tirar al resto: lo medido sirve igualmente de base.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    env:
      FILES: ${{ matrix.shard.files }}
      INCREMENTAL_FILE: .stryker-cache/shard-${{ matrix.shard.index }}.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El checker de tipos de Stryker usa `tsc`, que necesita los tipos que Astro genera en `.astro/`.
      - run: npx astro sync

      # Sin restaurar caché: esta ejecución reconstruye la base desde cero.
      - name: Mutar el trozo
        run: >
          npx stryker run
          --mutate "${FILES}"
          --incrementalFile "${INCREMENTAL_FILE}"
          --reporters clear-text,html,json

      # Se sube aunque Stryker falle: lo ya medido entra en la base unida.
      - name: Subir la base incremental del trozo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incremental-${{ matrix.shard.index }}
          path: ${{ env.INCREMENTAL_FILE }}
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Subir el informe del trozo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.shard.index }}
          path: reports/mutation/
          if-no-files-found: ignore

  merge:
    name: merge
    needs: [plan, mutation]
    # Aunque algún trozo falle, se une lo que haya: una base parcial vale más que ninguna.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGED_FILE: .stryker-cache/incremental.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Si ningún trozo llegó a subir su fichero no hay artefactos y el paso no debe romper el job.
      - name: Bajar las bases de los trozos
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: incremental-*
          path: .stryker-cache/shards
          merge-multiple: true

      - name: Unir las bases
        if: hashFiles('.stryker-cache/shards/*.json') != ''
        run: node scripts/mutation/cli.ts merge --out "${MERGED_FILE}" .stryker-cache/shards/*.json

      - name: Resumir
        if: hashFiles('.stryker-cache/incremental.json') != ''
        run: node scripts/mutation/cli.ts summary "${MERGED_FILE}" >> "$GITHUB_STEP_SUMMARY"

      # Los PR restauran con `restore-keys: stryker-incremental-` y parten de esta base.
      - name: Guardar la base unida en la caché
        if: hashFiles('.stryker-cache/incremental.json') != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MERGED_FILE }}
          key: stryker-incremental-${{ github.sha }}

      - name: Subir la base unida
        if: hashFiles('.stryker-cache/incremental.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: merged-incremental
          path: ${{ env.MERGED_FILE }}
          include-hidden-files: true
